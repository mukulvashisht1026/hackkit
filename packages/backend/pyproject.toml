[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "junction-kit-backend"
version = "0.1.0"
description = "FastAPI building blocks for hackathons: LLM wrapper, ingestion, retrieval (RAG), anomaly detection, hardware I/O"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pandas>=2.1",
  "duckdb>=0.10",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.30"]
docs = ["pypdf>=4.0", "python-pptx>=0.6.23", "openpyxl>=3.1"]
hardware = ["pyserial>=3.5", "paho-mqtt>=2.0"]
server = ["uvicorn[standard]>=0.29"]
all = ["junction-kit-backend[llm,docs,hardware,server]"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
